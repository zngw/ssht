{{define "content"}}
<h2>密码设置</h2>
<p class="desc">密码用于派生 AES-256-GCM 密钥来加密本地数据文件，修改密码会整体重新加密数据。</p>

{{if .Message}}<div class="alert ok">{{.Message}}</div>{{end}}
{{if .Error}}<div class="alert error">{{.Error}}</div>{{end}}

<div class="panel">
  <h3>修改密码</h3>
  <form method="post" action="/password/change" class="grid-form" autocomplete="off">
    <label>原密码<input type="password" name="old_password" required></label>
    <label>新密码<input type="password" name="new_password" required></label>
    <label>确认新密码<input type="password" name="confirm_password" required></label>
    <label>密码提示<input name="hint" value="{{.Hint}}" placeholder="忘记密码时可见，如: 某个纪念日"></label>
    <div class="form-actions"><button class="primary">修改密码</button></div>
  </form>
</div>

<div class="panel">
  <h3>危险操作</h3>
  <p class="desc">如果忘记密码，数据无法解密恢复，只能清空全部数据后重新使用。</p>
  <form method="post" action="/reset" onsubmit="return confirm('确定要清空并重置所有数据吗？此操作不可恢复！')">
    <button class="danger">重置所有数据</button>
  </form>
</div>
{{end}}
